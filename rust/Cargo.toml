[package]
name = "project-frank"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.27"
ratatui = "0.26"
rusqlite = { version = "0.31", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
once_cell = "1.18"
pyo3 = { version = "0.20", features = ["auto-initialize"] }
parking_lot = "0.12"
libloading = "0.8"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"

[build-dependencies]
cc = "1.0"

[features]
streaming = []
