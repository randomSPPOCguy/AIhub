<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 30px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }
        
        select, input, textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .chat-container {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        
        .message.assistant {
            background: white;
            border: 2px solid #e0e0e0;
        }
        
        .message .role {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.85em;
            opacity: 0.8;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
        }
        
        textarea {
            flex: 1;
            resize: vertical;
            min-height: 60px;
            max-height: 200px;
        }
        
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .hidden {
            display: none;
        }
        
        .toggle-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .toggle {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .clear-btn {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Hub</h1>
            <p>Unified interface for Gemini, OpenAI, and Claude</p>
        </div>
        
        <div class="content">
            <div id="status" class="status hidden"></div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="provider">AI Provider</label>
                    <select id="provider">
                        <option value="gemini">Google Gemini</option>
                        <option value="openai">OpenAI</option>
                        <option value="claude">Anthropic Claude</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="model">Model (optional)</label>
                    <input type="text" id="model" placeholder="Leave blank for default">
                </div>
                
                <div class="control-group">
                    <label for="temperature">Temperature (0-2)</label>
                    <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
                </div>
                
                <div class="control-group">
                    <label for="max_tokens">Max Tokens</label>
                    <input type="number" id="max_tokens" value="1000" min="1" max="4096">
                </div>
            </div>
            
            <div class="toggle-group" style="margin-bottom: 20px;">
                <div class="toggle">
                    <input type="checkbox" id="stream">
                    <label for="stream">Stream Response</label>
                </div>
                <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
            </div>
            
            <div class="chat-container" id="chat"></div>
            
            <div class="input-area">
                <textarea id="message" placeholder="Type your message here..."></textarea>
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        let conversationHistory = [];
        
        // Show status message
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 5000);
        }
        
        // Add message to chat
        function addMessage(role, content) {
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `
                <div class="role">${role.toUpperCase()}</div>
                <div>${content}</div>
            `;
            chat.appendChild(messageDiv);
            chat.scrollTop = chat.scrollHeight;
        }
        
        // Clear chat
        function clearChat() {
            conversationHistory = [];
            document.getElementById('chat').innerHTML = '';
            showStatus('Chat cleared', 'info');
        }
        
        // Send message
        async function sendMessage() {
            const messageInput = document.getElementById('message');
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            const provider = document.getElementById('provider').value;
            const model = document.getElementById('model').value || null;
            const temperature = parseFloat(document.getElementById('temperature').value);
            const maxTokens = parseInt(document.getElementById('max_tokens').value);
            const stream = document.getElementById('stream').checked;
            
            // Add user message
            conversationHistory.push({ role: 'user', content: message });
            addMessage('user', message);
            messageInput.value = '';
            
            // Disable send button
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            
            try {
                const requestBody = {
                    provider,
                    messages: conversationHistory,
                    temperature,
                    max_tokens: maxTokens,
                    stream
                };
                
                if (model) {
                    requestBody.model = model;
                }
                
                if (stream) {
                    await handleStreamResponse(requestBody);
                } else {
                    await handleNormalResponse(requestBody);
                }
                
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            }
        }
        
        // Handle normal response
        async function handleNormalResponse(requestBody) {
            const response = await fetch(`${API_URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Request failed');
            }
            
            const data = await response.json();
            conversationHistory.push({ role: 'assistant', content: data.content });
            addMessage('assistant', data.content);
            showStatus(`Response from ${data.provider} (${data.model})`, 'success');
        }
        
        // Handle streaming response
        async function handleStreamResponse(requestBody) {
            const response = await fetch(`${API_URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Request failed');
            }
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullContent = '';
            
            // Create assistant message container
            const chat = document.getElementById('chat');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.innerHTML = `
                <div class="role">ASSISTANT</div>
                <div class="content"></div>
            `;
            chat.appendChild(messageDiv);
            const contentDiv = messageDiv.querySelector('.content');
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.content) {
                                fullContent += data.content;
                                contentDiv.textContent = fullContent;
                                chat.scrollTop = chat.scrollHeight;
                            }
                        } catch (e) {
                            // Ignore parse errors
                        }
                    }
                }
            }
            
            conversationHistory.push({ role: 'assistant', content: fullContent });
            showStatus(`Streaming complete`, 'success');
        }
        
        // Allow Enter to send (Shift+Enter for new line)
        document.getElementById('message').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Check API health on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                console.log('API Health:', data);
            } catch (error) {
                showStatus('Cannot connect to API. Make sure the server is running.', 'error');
            }
        });
    </script>
</body>
</html>
